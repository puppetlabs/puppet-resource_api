name: "ci"

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  linux_tests:
    name: Linux, Puppet ${{ matrix.cfg.puppet_version }}, Ruby ${{ matrix.cfg.ruby }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - {puppet_version: '8', ruby: '3.2'}
          - {puppet_version: '8', ruby: 'jruby-9.4.2.0'}
          - {puppet_version: '9', ruby: '4.0'}
          - {puppet_version: '9', ruby: 'jruby-10.1.1.0'}
    env:
      PUPPET_GEM_VERSION: ~> ${{ matrix.cfg.puppet_version }}
      # Puppet 9 (and its facter/ffi dependencies compatible with Ruby 4.0) are not yet published to
      # public RubyGems -- route the gem resolution through the private PuppetCore source instead.
      # See rubygems-puppetcore usage in ruby-pwsh#385 / bolt-private#120 for the established pattern.
      PUPPET_FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_TOKEN }}
      BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: "forge-key:${{ secrets.PUPPET_FORGE_TOKEN }}"
    steps:
      - name: Checkout current PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ruby version ${{ matrix.cfg.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.cfg.ruby }}
      - name: Update rubygems and install gems
        run: |
          bundle config set without development
          bundle install --jobs 4 --retry 3

      - name: DIAGNOSTIC bundle state
        run: |
          echo "--- bundle list | grep puppet ---"
          bundle list | grep -i puppet || true
          echo "--- Gemfile.lock puppet/facter entries ---"
          grep -B2 -A2 "^    puppet \|^    facter \|remote:" Gemfile.lock || true
          echo "--- trivial bundle exec ruby require puppet ---"
          bundle exec ruby -e "require 'puppet'; puts Puppet::PUPPETVERSION" || echo "TRIVIAL REQUIRE FAILED exit=$?"
          echo "--- trivial bundle exec rubocop --version (no rake) ---"
          bundle exec rubocop --version || echo "BARE RUBOCOP FAILED exit=$?"
          echo "--- bundle check ---"
          bundle check || echo "BUNDLE CHECK FAILED exit=$?"

      - name: Rubocop
        run: |
          bundle exec rake rubocop

      - name: Run tests
        run: |
          bundle exec rake spec

  # Starting with version 3.2, Ruby no longer bundles libffi, which is necessary for tests on Windows. Due to a discrepancy between the C
  # library the Windows Puppet gem is built against and what GitHub runners use (MinGW and ucrt, respectively) we can't install the
  # Windows-specific Puppet gem that includes libffi. To work around these issues, we have a separate "integration" group that we include
  # when testing Puppet 8 / Ruby 3.2 on Windows. See PA-5406 for more.
  windows_tests:
    name: Windows, Puppet ${{ matrix.cfg.puppet_version }}, Ruby ${{ matrix.cfg.ruby }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - {puppet_version: '8', ruby: '3.2', extra: 'bundle config set with integration'}
          - {puppet_version: '9', ruby: '4.0', extra: 'bundle config set with integration'}
    env:
      PUPPET_GEM_VERSION: ~> ${{ matrix.cfg.puppet_version }}
      PUPPET_FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_TOKEN }}
      BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: "forge-key:${{ secrets.PUPPET_FORGE_TOKEN }}"
    steps:
      - name: Checkout current PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ruby version ${{ matrix.cfg.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.cfg.ruby }}
      - name: Update rubygems and install gems
        run: |
          bundle config set without development
          ${{ matrix.cfg.extra }}
          bundle install --jobs 4 --retry 3

      - name: Rubocop
        run: |
          bundle exec rake rubocop

      - name: Run tests
        run: |
          bundle exec rake spec
